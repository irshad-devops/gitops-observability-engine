api:
  replicaCount: 2

  image:
    repository: linuxautomator/gitops-demo-api
    tag: "dev"
    pullPolicy: IfNotPresent

  containerPort: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    APP_VERSION: "1.0.0"

frontend:
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.29-alpine"
    pullPolicy: IfNotPresent

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent

  storage:
    size: 1Gi

  database: portfolio
  username: portfolio

ingress:
  enabled: true
  className: nginx
  host: gitops.local
