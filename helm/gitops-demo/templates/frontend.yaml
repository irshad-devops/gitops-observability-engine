apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <title>GitOps Observability Engine</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        code { background: #eee; padding: 3px 6px; }
      </style>
    </head>
    <body>
      <h1>GitOps & Observability Engine</h1>
      <p>Frontend is running on Kubernetes.</p>
      <p>API health: <code>/api/health</code></p>
      <p>Database check: <code>/api/db</code></p>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: frontend-content
