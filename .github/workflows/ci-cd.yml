name: CI-CD-GitOps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -q

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-api:${{ github.sha }} app

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-api:${{ github.sha }}

  update-gitops:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Helm image
        run: |
          sed -i "s#repository: .*#repository: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo-api#" helm/gitops-demo/values.yaml
          sed -i '0,/tag: ".*"/s//tag: "${{ github.sha }}"/' helm/gitops-demo/values.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-demo/values.yaml
          git commit -m "chore: deploy image ${{ github.sha }}" || exit 0
          git push
